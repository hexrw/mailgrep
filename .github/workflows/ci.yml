name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t tests -v

  system-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests on the stock macOS interpreter
        run: /usr/bin/python3 -m unittest discover -s tests -t tests

  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and check the entry point
        run: |
          pip install .
          mailgrep --help
          mailgrep --mail-root "$RUNNER_TEMP/absent" doctor && exit 1 || test $? -eq 2
